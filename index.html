<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENSI-CORE · Calibrador de sensibilidad Free Fire</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--bg2:#0b0e22;--ink:#e8f6ff;--mute:#8aa0c2;--cy:#3df2ff;--mg:#ff2e9a;--am:#ffb23d;--line:#1d2a55;
--d:'Orbitron','Trebuchet MS',sans-serif;--b:'Rajdhani','Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4ff;--bg2:#fff;--ink:#0a1230;--mute:#4a5f86;--cy:#0079c9;--mg:#c4106f;--am:#a86400;--line:#b9c8ea}}
:root[data-theme="light"]{--bg:#eef4ff;--bg2:#fff;--ink:#0a1230;--mute:#4a5f86;--cy:#0079c9;--mg:#c4106f;--am:#a86400;--line:#b9c8ea}
:root[data-theme="dark"]{--bg:#05060f;--bg2:#0b0e22;--ink:#e8f6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 var(--b);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,transparent 0,var(--bg) 75%);pointer-events:none}
main{position:relative;max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(30px,9vw,52px)/1 var(--d);margin:8px 0 6px;letter-spacing:.02em}
h1 span{color:var(--cy);text-shadow:0 0 18px var(--cy)}
h2{font:800 15px var(--d);letter-spacing:.08em;margin:34px 0 12px;color:var(--cy)}
.sub{color:var(--mute);margin:0 0 6px;max-width:46ch}
.panel{background:color-mix(in srgb,var(--bg2) 88%,transparent);border:1px solid var(--line);border-radius:4px 18px 4px 18px;padding:14px;position:relative}
.panel::after{content:"";position:absolute;top:-1px;left:-1px;width:26px;height:26px;border-top:2px solid var(--cy);border-left:2px solid var(--cy)}
/* reticle */
.dial{display:grid;place-items:center;margin:6px 0 0}
.dial svg{width:min(88vw,340px);height:auto;overflow:visible}
.ring{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.sweep{transform-origin:160px 160px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font:800 62px var(--d);fill:var(--ink)}
.cap{font:600 13px var(--b);fill:var(--mute);letter-spacing:.2em}
/* controls */
.grp{margin:0 0 14px}
.grp>b{display:block;font:600 14px var(--b);color:var(--mute);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
